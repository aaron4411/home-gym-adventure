<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Gym Adventure</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background: #0a0a1a; min-height: 100vh; overflow-x: hidden; }
    .starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
    .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: 1; }
    .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px); pointer-events: none; z-index: 1000; opacity: 0.3; }
    @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes neonPulse { 0%, 100% { box-shadow: 0 0 5px currentColor, 0 0 10px currentColor, 0 0 20px currentColor; } 50% { box-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    input:focus, select:focus, button:focus, textarea:focus { outline: none; }
    button { transition: all 0.2s ease; font-family: 'Quicksand', sans-serif; }
    button:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
    .neon-card { background: linear-gradient(135deg, rgba(20,20,40,0.9) 0%, rgba(30,30,60,0.9) 100%); border: 2px solid #00ffff; box-shadow: 0 0 20px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.05); backdrop-filter: blur(10px); }
    .arcade-btn { font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 2px; position: relative; overflow: hidden; }
    .arcade-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: left 0.5s; }
    .arcade-btn:hover::before { left: 100%; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin: 2px 4px 2px 0; max-width: 100%; }
    @keyframes timeUp { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    select { font-family: 'Quicksand', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const StarField = () => {
      const stars = Array.from({ length: 100 }, (_, i) => ({ id: i, left: Math.random() * 100, top: Math.random() * 100, size: Math.random() * 3 + 1, delay: Math.random() * 3, duration: Math.random() * 2 + 2 }));
      return (<div className="starfield">{stars.map(star => (<div key={star.id} className="star" style={{ left: `${star.left}%`, top: `${star.top}%`, width: `${star.size}px`, height: `${star.size}px`, animationDelay: `${star.delay}s`, animationDuration: `${star.duration}s` }} />))}</div>);
    };

    const COLOR_OPTIONS = [
      { id: 'cyan', gradient: 'linear-gradient(135deg, #00ffff 0%, #0080ff 100%)', primary: '#00ffff', glow: '0 0 20px #00ffff' },
      { id: 'magenta', gradient: 'linear-gradient(135deg, #ff00ff 0%, #ff0080 100%)', primary: '#ff00ff', glow: '0 0 20px #ff00ff' },
      { id: 'lime', gradient: 'linear-gradient(135deg, #00ff00 0%, #80ff00 100%)', primary: '#00ff00', glow: '0 0 20px #00ff00' },
      { id: 'gold', gradient: 'linear-gradient(135deg, #ffff00 0%, #ffaa00 100%)', primary: '#ffff00', glow: '0 0 20px #ffff00' },
      { id: 'orange', gradient: 'linear-gradient(135deg, #ff8000 0%, #ff4000 100%)', primary: '#ff8000', glow: '0 0 20px #ff8000' },
      { id: 'pink', gradient: 'linear-gradient(135deg, #ff80ff 0%, #ff00aa 100%)', primary: '#ff80ff', glow: '0 0 20px #ff80ff' },
      { id: 'blue', gradient: 'linear-gradient(135deg, #4080ff 0%, #0040ff 100%)', primary: '#4080ff', glow: '0 0 20px #4080ff' },
      { id: 'purple', gradient: 'linear-gradient(135deg, #aa00ff 0%, #6600ff 100%)', primary: '#aa00ff', glow: '0 0 20px #aa00ff' },
    ];

    const AVATARS = [
      { id: 'trex', name: 'T-Rex', emoji: '🦖', badges: ['Baby Rex', 'Young Rex', 'Mighty T-Rex'] },
      { id: 'stego', name: 'Stegosaurus', emoji: '🦕', badges: ['Tiny Stego', 'Growing Stego', 'Grand Stegosaurus'] },
      { id: 'lion', name: 'Lion', emoji: '🦁', badges: ['Lion Cub', 'Young Lion', 'King of Jungle'] },
      { id: 'butterfly', name: 'Butterfly', emoji: '🦋', badges: ['Caterpillar', 'Cocoon', 'Beautiful Butterfly'] },
      { id: 'frog', name: 'Frog', emoji: '🐸', badges: ['Tadpole', 'Froglet', 'Leaping Frog'] },
      { id: 'eagle', name: 'Eagle', emoji: '🦅', badges: ['Eaglet', 'Fledgling', 'Soaring Eagle'] },
      { id: 'tiger', name: 'Tiger', emoji: '🐯', badges: ['Tiger Cub', 'Young Tiger', 'Fierce Tiger'] },
      { id: 'dragon', name: 'Dragon', emoji: '🐉', badges: ['Dragon Egg', 'Hatchling', 'Mighty Dragon'] },
      { id: 'unicorn', name: 'Unicorn', emoji: '🦄', badges: ['Baby Unicorn', 'Young Unicorn', 'Magical Unicorn'] },
      { id: 'bee', name: 'Bee', emoji: '🐝', badges: ['Larva Bee', 'Worker Bee', 'Queen Bee'] },
      { id: 'ladybug', name: 'Ladybug', emoji: '🐞', badges: ['Tiny Dot', 'Spotted Bug', 'Lucky Ladybug'] },
      { id: 'bear', name: 'Bear', emoji: '🐻', badges: ['Baby Cub', 'Young Bear', 'Big Bear'] },
    ];

    const LEVELS = [
      { level: 1, name: 'Stardust', minXP: 0, emoji: '✨' },
      { level: 2, name: 'Comet', minXP: 100, emoji: '☄️' },
      { level: 3, name: 'Moon Walker', minXP: 300, emoji: '🌙' },
      { level: 4, name: 'Star Pilot', minXP: 600, emoji: '⭐' },
      { level: 5, name: 'Nebula Master', minXP: 1000, emoji: '🌌' },
      { level: 6, name: 'Galaxy Hero', minXP: 1500, emoji: '🌟' },
      { level: 7, name: 'Cosmic Legend', minXP: 2500, emoji: '💫' },
      { level: 8, name: 'Universe Champion', minXP: 4000, emoji: '🏆' },
    ];

    const generateAvatarBadges = () => {
      const badges = [];
      AVATARS.forEach(avatar => {
        avatar.badges.forEach((badgeName, index) => {
          const threshold = index === 0 ? 1 : index === 1 ? 5 : 10;
          badges.push({ id: `${avatar.id}_${index + 1}`, name: badgeName, emoji: avatar.emoji, description: `Complete ${threshold} ${threshold === 1 ? 'activity' : 'activities'} as ${avatar.name}`, avatarId: avatar.id, threshold, tier: index + 1 });
        });
      });
      return badges;
    };
    const AVATAR_BADGES = generateAvatarBadges();

    const BADGES = [
      { id: 'first_steps', name: 'First Steps', emoji: '👣', description: 'Complete your first activity', condition: (s) => s.totalCompleted >= 1 },
      { id: 'getting_warmed_up', name: 'Warming Up', emoji: '🔥', description: 'Complete 5 activities', condition: (s) => s.totalCompleted >= 5 },
      { id: 'on_fire', name: 'On Fire!', emoji: '🌟', description: 'Complete 10 activities', condition: (s) => s.totalCompleted >= 10 },
      { id: 'unstoppable', name: 'Unstoppable', emoji: '💪', description: 'Complete 25 activities', condition: (s) => s.totalCompleted >= 25 },
      { id: 'superstar', name: 'Superstar', emoji: '🌠', description: 'Complete 50 activities', condition: (s) => s.totalCompleted >= 50 },
      { id: 'century', name: 'Century Club', emoji: '💯', description: 'Earn 100 points', condition: (s) => s.totalPoints >= 100 },
      { id: 'five_hundred', name: 'High Scorer', emoji: '🎯', description: 'Earn 500 points', condition: (s) => s.totalPoints >= 500 },
      { id: 'thousand', name: 'Point Master', emoji: '🏅', description: 'Earn 1000 points', condition: (s) => s.totalPoints >= 1000 },
      { id: 'two_thousand', name: 'XP Legend', emoji: '👑', description: 'Earn 2000 points', condition: (s) => s.totalPoints >= 2000 },
      { id: 'balance_starter', name: 'Finding Balance', emoji: '🧘', description: 'Complete 3 balance activities', condition: (s) => s.balanceCompleted >= 3 },
      { id: 'balance_master', name: 'Balance Master', emoji: '⚖️', description: 'Complete 10 balance activities', condition: (s) => s.balanceCompleted >= 10 },
      { id: 'jump_starter', name: 'First Jumps', emoji: '🦘', description: 'Complete 3 jumping activities', condition: (s) => s.jumpCompleted >= 3 },
      { id: 'jump_champion', name: 'Jump Champion', emoji: '🚀', description: 'Complete 10 jumping activities', condition: (s) => s.jumpCompleted >= 10 },
      { id: 'team_starter', name: 'Team Spirit', emoji: '🤝', description: 'Complete 3 team activities', condition: (s) => s.teamCompleted >= 3 },
      { id: 'team_player', name: 'Team Player', emoji: '👨‍👩‍👧‍👦', description: 'Complete 10 team activities', condition: (s) => s.teamCompleted >= 10 },
      { id: 'strength_starter', name: 'Getting Strong', emoji: '💪', description: 'Complete 3 strength activities', condition: (s) => s.strengthCompleted >= 3 },
      { id: 'strength_hero', name: 'Strength Hero', emoji: '🦸', description: 'Complete 10 strength activities', condition: (s) => s.strengthCompleted >= 10 },
      { id: 'favorite_finder', name: 'Favorite Finder', emoji: '❤️', description: 'Add 3 activities to favorites', condition: (s) => s.favoritesCount >= 3 },
      { id: 'explorer', name: 'Activity Explorer', emoji: '🧭', description: 'Try 15 different activities', condition: (s) => s.uniqueActivities >= 15 },
      { id: 'adventurer', name: 'Grand Adventurer', emoji: '🗺️', description: 'Try 30 different activities', condition: (s) => s.uniqueActivities >= 30 },
      { id: 'streak_starter', name: 'Streak Starter', emoji: '📅', description: 'Complete activities 3 different days', condition: (s) => s.uniqueDays >= 3 },
      { id: 'weekly_warrior', name: 'Weekly Warrior', emoji: '🗓️', description: 'Complete activities 7 different days', condition: (s) => s.uniqueDays >= 7 },
      { id: 'monthly_master', name: 'Monthly Master', emoji: '📆', description: 'Complete activities 14 different days', condition: (s) => s.uniqueDays >= 14 },
      { id: 'dance_starter', name: 'Dance Beginner', emoji: '💃', description: 'Complete 3 dance activities', condition: (s) => s.danceCompleted >= 3 },
      { id: 'dance_star', name: 'Dance Star', emoji: '🕺', description: 'Complete 10 dance activities', condition: (s) => s.danceCompleted >= 10 },
      { id: 'yoga_beginner', name: 'Yoga Beginner', emoji: '🧘‍♀️', description: 'Complete 3 yoga activities', condition: (s) => s.yogaCompleted >= 3 },
      { id: 'zen_master', name: 'Zen Master', emoji: '☯️', description: 'Complete 10 yoga activities', condition: (s) => s.yogaCompleted >= 10 },
      { id: 'obstacle_runner', name: 'Obstacle Runner', emoji: '🏃', description: 'Complete 3 obstacle courses', condition: (s) => s.obstacleCompleted >= 3 },
      { id: 'ninja_warrior', name: 'Ninja Warrior', emoji: '🥷', description: 'Complete 10 obstacle courses', condition: (s) => s.obstacleCompleted >= 10 },
      { id: 'core_starter', name: 'Core Cadet', emoji: '🧱', description: 'Complete 3 core activities', condition: (s) => s.coreCompleted >= 3 },
      { id: 'core_hero', name: 'Iron Core', emoji: '🛡️', description: 'Complete 10 core activities', condition: (s) => s.coreCompleted >= 10 },
      { id: 'cardio_starter', name: 'Heart Pumper', emoji: '❤️', description: 'Complete 3 cardio activities', condition: (s) => s.cardioCompleted >= 3 },
      { id: 'cardio_hero', name: 'Endurance Engine', emoji: '🔋', description: 'Complete 10 cardio activities', condition: (s) => s.cardioCompleted >= 10 },
      { id: 'agility_starter', name: 'Quick Feet', emoji: '🪜', description: 'Complete 3 agility activities', condition: (s) => s.agilityCompleted >= 3 },
      { id: 'agility_hero', name: 'Lightning Legs', emoji: '⚡', description: 'Complete 10 agility activities', condition: (s) => s.agilityCompleted >= 10 },
      { id: 'course_first', name: 'Course Cadet', emoji: '🧭', description: 'Finish your first course', condition: (s) => s.coursesCompleted >= 1 },
      { id: 'course_five', name: 'Course Crusher', emoji: '🏁', description: 'Finish 5 courses', condition: (s) => s.coursesCompleted >= 5 },
      { id: 'course_variety', name: 'All-Rounder', emoji: '🌈', description: 'Finish 5 different courses', condition: (s) => s.uniqueCourses >= 5 },
    ];
    // ===== AGE TIERS =====
    // Every exercise has a target for each tier. A player's age picks their tier.
    const TIERS = [
      { id: 'rookie', label: 'Rookie', ages: '9–10', maxAge: 10, color: '#00ff00', emoji: '🟢' },
      { id: 'pro', label: 'Pro', ages: '11–12', maxAge: 12, color: '#ffff00', emoji: '🟡' },
      { id: 'elite', label: 'Elite', ages: '13+', maxAge: 999, color: '#ff00ff', emoji: '🟣' },
    ];
    const getTier = (age) => { const a = Number(age); if (isNaN(a)) return TIERS[1]; return TIERS.find(t => a <= t.maxAge); };

    // ===== WHAT EACH EXERCISE TRAINS =====
    const MUSCLES = {
      core: { label: 'Core / Abs', emoji: '🧱' }, back: { label: 'Back', emoji: '🔙' }, chest: { label: 'Chest', emoji: '🛡️' },
      shoulders: { label: 'Shoulders', emoji: '🏔️' }, biceps: { label: 'Biceps', emoji: '💪' }, triceps: { label: 'Triceps', emoji: '🦾' },
      glutes: { label: 'Glutes', emoji: '🍑' }, quads: { label: 'Quads', emoji: '🦵' }, hamstrings: { label: 'Hamstrings', emoji: '🦿' },
      calves: { label: 'Calves', emoji: '🦶' }, heart: { label: 'Heart & Lungs', emoji: '❤️' },
    };
    const SKILLS = {
      balance: { label: 'Balance', emoji: '⚖️' },
      proprio: { label: 'Body Awareness (proprioception)', emoji: '🧠' },
      coordination: { label: 'Coordination', emoji: '🔀' },
      agility: { label: 'Agility', emoji: '🐆' },
      handeye: { label: 'Hand-Eye', emoji: '👀' },
      aim: { label: 'Aim', emoji: '🎯' },
      flexibility: { label: 'Flexibility', emoji: '🌀' },
      rhythm: { label: 'Rhythm', emoji: '🎵' },
      reaction: { label: 'Reaction Time', emoji: '⚡' },
    };
    const WORK_TYPES = {
      blast: { label: 'Blast-Off', emoji: '🚀', color: '#ff4040', info: 'Explosive power — fast-twitch muscles fire all at once (jumps, sprints, throws).' },
      strength: { label: 'Strength Builder', emoji: '🏋️', color: '#ff8000', info: 'Slow, controlled reps against resistance or body weight to build muscle strength.' },
      hold: { label: 'Freeze Hold', emoji: '🧊', color: '#40c0ff', info: 'Isometric work — holding still under tension (planks, wall sits, balances).' },
      engine: { label: 'Endurance Engine', emoji: '🔋', color: '#00ff80', info: 'Keep going! Trains your heart, lungs and muscles to last longer.' },
      quick: { label: 'Quick Feet', emoji: '⚡', color: '#ffff00', info: 'Speed and agility — fast feet, quick direction changes.' },
      skill: { label: 'Skill Practice', emoji: '🎮', color: '#00ffff', info: 'Lower effort, high focus — training brain and body to work together (aiming, catching, timing).' },
      stretch: { label: 'Stretch & Flex', emoji: '🌀', color: '#c080ff', info: 'Lengthens muscles and loosens joints for flexibility and recovery.' },
    };

    const EQUIPMENT_OPTIONS = [
      { id: 'cones', name: 'Saucer Cones', emoji: '🔶' }, { id: 'foam_balls', name: 'Foam Balls', emoji: '🔴' },
      { id: 'plyo_6', name: 'Plyo Box 6"', emoji: '📦' }, { id: 'plyo_12', name: 'Plyo Box 12"', emoji: '📦' },
      { id: 'plyo_18', name: 'Plyo Box 18"', emoji: '📦' }, { id: 'bosu', name: 'Bosu Ball', emoji: '🔵' },
      { id: 'yoga_mat', name: 'Yoga Mat', emoji: '🧘' }, { id: 'yoga_blocks', name: 'Yoga Blocks', emoji: '🧱' },
      { id: 'weights', name: 'Light Weights', emoji: '🏋️' }, { id: 'balance_beam', name: 'Balance Beam', emoji: '➖' },
      { id: 'barre', name: 'Ballet Barre', emoji: '🩰' }, { id: 'stepping_stones', name: 'Stepping Stones', emoji: '🪨' },
      { id: 'agility_ladder', name: 'Agility Ladder', emoji: '🪜' },
      { id: 'blankets', name: 'Blankets', emoji: '🛏️' },
    ];

    // X(id, name, category, intensity, points, seconds, equipment, muscles, skills, work, description, [rookie, pro, elite], extra)
    const X = (id, name, category, difficulty, points, durationSec, equipment, muscles, skills, work, description, tiers, extra = {}) =>
      ({ id, name, category, difficulty, points, durationSec, equipment, muscles, skills, work, description, tiers: { rookie: tiers[0], pro: tiers[1], elite: tiers[2] }, tags: [], ...extra });
    // No age limits: every player can do every exercise. Players under 9 get Rookie targets.
    // recommendedAge (optional) only shows an advisory label.

    const ACTIVITY_LIBRARY = [
      // ---------- JUMP ----------
      X(1, 'T-Rex Stomp Jumps', 'jump', 'Medium', 20, 60, [], ['quads', 'glutes', 'calves'], ['proprio'], ['blast'], 'Squat down low, then explode up and land with a big soft T-Rex stomp. Knees stay over toes on landing.', ['8 stomp jumps', '12 stomp jumps + 3-sec squat hold every 4', '20 stomp jumps — max height every time']),
      X(2, 'Frog Pond Hop', 'jump', 'Medium', 20, 90, ['stepping_stones'], ['calves', 'quads', 'glutes'], ['balance', 'proprio', 'coordination'], ['blast'], 'Hop stone to stone without touching the "water". Stick each landing for one second.', ['2 crossings, two-foot hops', '3 crossings, single-leg hops on the last 3 stones', '4 crossings all single-leg, switch legs each lap']),
      X(3, 'Kangaroo Box Jumps', 'jump', 'Hard', 25, 90, ['plyo_6'], ['quads', 'glutes', 'calves'], ['proprio'], ['blast'], 'Jump up onto the box, land softly in a squat, stand tall, step down (never jump down).', ['6" box · 6 jumps', '12" box · 8 jumps', '18" box · 10 jumps (or 12" with a tuck)']),
      X(4, 'Grasshopper Challenge', 'agility', 'Medium', 20, 45, ['cones'], ['calves', 'quads'], ['agility', 'coordination'], ['quick', 'blast'], 'Side-to-side hops over a cone. Count your hops and try to beat your record.', ['20 seconds', '30 seconds', '45 seconds — beat your best']),
      X(44, 'Plyo Power Staircase', 'jump', 'Hard', 40, 120, ['plyo_6', 'plyo_12', 'plyo_18'], ['quads', 'glutes', 'calves'], ['proprio'], ['blast'], 'Jump up the boxes from smallest to biggest, stepping down between each. Full reset before each jump.', ['6" and 12" only · 3 rounds', 'All 3 boxes · 3 rounds', 'All 3 boxes · 5 rounds'], { recommendedAge: 11 }),
      X(56, 'Jump Squat Rockets', 'jump', 'Hard', 25, 60, [], ['quads', 'glutes', 'calves'], ['proprio'], ['blast'], 'Squat until thighs are near parallel, then launch straight up. Land soft and go right into the next one.', ['8 regular squats + 4 jump squats', '12 jump squats', '20 jump squats']),
      X(61, 'Tuck Jump Launch', 'jump', 'Hard', 25, 45, [], ['quads', 'core', 'calves'], ['proprio'], ['blast'], 'Jump high and pull your knees to your chest. Land quietly on the balls of your feet.', ['5 tuck jumps (rest as needed)', '8 tuck jumps', '12 tuck jumps in a row']),
      X(62, 'Broad Jump Distance', 'jump', 'Medium', 20, 90, ['cones'], ['glutes', 'hamstrings', 'quads'], ['proprio', 'coordination'], ['blast'], 'Swing your arms and jump forward as far as you can. Mark your best landing with a cone.', ['5 jumps, mark your best', '8 jumps, beat your mark', '10 jumps + 3 bounds in a row']),

      // ---------- AGILITY / LADDER ----------
      X(63, 'Speed Skater Hops', 'agility', 'Medium', 20, 60, [], ['glutes', 'quads', 'calves'], ['balance', 'agility'], ['quick', 'blast'], 'Leap sideways from one foot to the other like a speed skater. Hold each landing for a beat.', ['10 each side', '15 each side', '20 each side with a 1-sec freeze on landing']),
      X(68, 'Ladder Quick Feet', 'agility', 'Medium', 20, 60, ['agility_ladder'], ['calves', 'quads', 'heart'], ['agility', 'coordination'], ['quick'], 'Run through the ladder with both feet touching down in every box. Stay on the balls of your feet.', ['4 passes, steady', '6 passes, faster', '8 passes, timed — beat your best']),
      X(69, 'Ladder In-In-Out-Out', 'agility', 'Medium', 20, 60, ['agility_ladder'], ['calves', 'quads'], ['agility', 'coordination', 'rhythm'], ['quick'], 'Step in-in to the box, out-out to the sides, then move to the next box. Say the rhythm out loud!', ['3 passes', '5 passes', '6 passes + 2 going backward']),
      X(70, 'Ladder Icky Shuffle', 'agility', 'Hard', 25, 75, ['agility_ladder'], ['calves', 'quads', 'glutes'], ['agility', 'coordination', 'rhythm'], ['quick'], 'In-in-out pattern that zig-zags across the ladder (in, in, out to the side; repeat leading with the other foot).', ['3 slow passes — learn it', '5 passes', '8 passes at full speed']),
      X(71, 'Ladder Hopscotch', 'agility', 'Medium', 20, 60, ['agility_ladder'], ['calves', 'quads'], ['balance', 'agility', 'proprio'], ['quick', 'blast'], 'Two feet in a box, one foot out, alternating down the ladder like hopscotch.', ['3 passes two-footed', '5 passes hopscotch', '6 passes single-leg (3 each leg)']),

        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', color: '#888' }}><span>🏆 {participant.completedActivities?.length || 0} completed</span><span>🏅 {(participant.earnedBadges?.length || 0) + (participant.avatarBadges?.length || 0)} badges</span></div>
      </div>);

    const ParticipantEditor = ({ participant, onSave, onCancel, onDelete, isNew }) => {
      const [stableId] = useState(() => participant?.id || Date.now().toString());

      return (<div className="neon-card" style={{ borderRadius: '16px', padding: '20px', marginBottom: '16px' }}>
        <h3 style={{ margin: '0 0 16px 0', color: '#00ffff', fontFamily: 'Orbitron, sans-serif' }}>{isNew ? 'NEW PILOT' : 'EDIT PILOT'}</h3>
        <div style={{ marginBottom: '16px' }}><label style={{ display: 'block', marginBottom: '6px', color: '#888', fontFamily: 'Orbitron, sans-serif', fontSize: '12px' }}>NAME</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Enter name" style={{ width: '100%', padding: '12px', borderRadius: '8px', border: '2px solid #00ffff', fontSize: '16px', boxSizing: 'border-box', background: 'rgba(0,0,0,0.5)', color: '#fff' }} /></div>

        <div style={{ marginBottom: '20px' }}><label style={{ display: 'block', marginBottom: '6px', color: '#888', fontFamily: 'Orbitron, sans-serif', fontSize: '12px' }}>COLOR THEME</label><div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>{COLOR_OPTIONS.map(c => (<button key={c.id} onClick={() => setColor(c.id)} style={{ width: '52px', height: '52px', borderRadius: '12px', border: color === c.id ? '3px solid #fff' : '2px solid transparent', background: c.gradient, cursor: 'pointer', boxShadow: color === c.id ? `0 0 20px ${c.primary}` : c.glow }} />))}</div></div>
        <div style={{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}><button onClick={handleSaveClick} disabled={!name || !age} style={{ padding: '12px 24px', borderRadius: '8px', border: '2px solid #00ff00', background: 'transparent', color: name && age ? '#00ff00' : '#444', fontWeight: 'bold', fontSize: '14px', cursor: name && age ? 'pointer' : 'not-allowed', fontFamily: 'Orbitron, sans-serif', boxShadow: name && age ? '0 0 15px rgba(0,255,0,0.3)' : 'none' }}>{isNew ? 'ADD PILOT' : 'SAVE'}</button><button onClick={onCancel} style={{ padding: '12px 24px', borderRadius: '8px', border: '1px solid #444', background: 'transparent', color: '#888', fontWeight: 'bold', fontSize: '14px', cursor: 'pointer' }}>CANCEL</button>{!isNew && (<button onClick={() => onDelete(stableId)} style={{ padding: '12px 24px', borderRadius: '8px', border: '2px solid #ff0000', background: 'transparent', color: '#ff0000', fontWeight: 'bold', fontSize: '14px', cursor: 'pointer', marginLeft: 'auto', fontFamily: 'Orbitron, sans-serif' }}>DELETE</button>)}</div>
      </div>);
