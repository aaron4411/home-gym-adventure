    const Settings = ({ participants, equipment, activityNotes, onSaveParticipant, onDeleteParticipant, onToggleEquipment }) => {
      const [editingId, setEditingId] = useState(null);
      const [showAddNew, setShowAddNew] = useState(false);
      const handleSave = (participantData) => { onSaveParticipant(participantData); setEditingId(null); setShowAddNew(false); };
      const activitiesWithNotes = ACTIVITY_LIBRARY.filter(a => activityNotes[a.id]);

      return (<div>
        <h1 style={{ fontSize: '28px', margin: '0 0 24px 0', color: '#00ffff', fontFamily: 'Orbitron, sans-serif', textShadow: '0 0 20px #00ffff' }}>⚙️ COMMAND CENTER</h1>
        <div className="neon-card" style={{ borderRadius: '16px', padding: '20px', marginBottom: '24px' }}><h2 style={{ margin: '0 0 16px 0', color: '#ff00ff', fontFamily: 'Orbitron, sans-serif' }}>👥 PILOTS ({participants.length}/4)</h2>{participants.map(p => { if (editingId === p.id) { return <ParticipantEditor key={p.id} participant={p} onSave={handleSave} onCancel={() => setEditingId(null)} onDelete={(id) => { onDeleteParticipant(id); setEditingId(null); }} isNew={false} />; } const avatar = AVATARS.find(a => a.id === p.avatar); const color = COLOR_OPTIONS.find(c => c.id === p.color) || COLOR_OPTIONS[0]; return (<div key={p.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px', background: 'rgba(0,0,0,0.3)', borderRadius: '12px', marginBottom: '8px', border: `2px solid ${color.primary}`, boxShadow: `0 0 15px ${color.primary}30` }}><div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}><span style={{ fontSize: '36px', filter: `drop-shadow(0 0 10px ${color.primary})` }}>{avatar?.emoji}</span><div><div style={{ fontWeight: 'bold', fontSize: '18px', color: color.primary, fontFamily: 'Orbitron, sans-serif' }}>{p.name}</div><div style={{ fontSize: '14px', color: '#888' }}>Age {p.age} • {p.xp} XP</div></div></div><button onClick={() => setEditingId(p.id)} style={{ padding: '8px 20px', borderRadius: '8px', border: `1px solid ${color.primary}`, background: 'transparent', color: color.primary, fontWeight: 'bold', cursor: 'pointer', fontFamily: 'Orbitron, sans-serif' }}>✏️ EDIT</button></div>); })}{showAddNew ? (<ParticipantEditor participant={{ id: Date.now().toString(), xp: 0, completedActivities: [], earnedBadges: [], avatarBadges: [] }} onSave={handleSave} onCancel={() => setShowAddNew(false)} onDelete={() => {}} isNew={true} />) : (participants.length < 4 && (<button onClick={() => setShowAddNew(true)} style={{ width: '100%', padding: '16px', borderRadius: '12px', border: '2px dashed #00ffff', background: 'transparent', color: '#00ffff', fontWeight: 'bold', fontSize: '16px', cursor: 'pointer', marginTop: '8px', fontFamily: 'Orbitron, sans-serif' }}>+ ADD PILOT</button>))}</div>
        <div className="neon-card" style={{ borderRadius: '16px', padding: '20px', marginBottom: '24px' }}><h2 style={{ margin: '0 0 16px 0', color: '#ffff00', fontFamily: 'Orbitron, sans-serif' }}>🏋️ EQUIPMENT BAY</h2><p style={{ color: '#888', marginBottom: '16px', fontSize: '14px' }}>Select available equipment to unlock missions.</p><div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(200px, 1fr))', gap: '8px' }}>{EQUIPMENT_OPTIONS.map(eq => (<label key={eq.id} style={{ display: 'flex', alignItems: 'center', gap: '12px', padding: '12px', backgroundColor: equipment.includes(eq.id) ? 'rgba(0,255,0,0.1)' : 'rgba(0,0,0,0.3)', borderRadius: '12px', cursor: 'pointer', border: equipment.includes(eq.id) ? '1px solid #00ff00' : '1px solid #333' }}><input type="checkbox" checked={equipment.includes(eq.id)} onChange={() => onToggleEquipment(eq.id)} style={{ width: '20px', height: '20px', accentColor: '#00ff00' }} /><span style={{ fontSize: '20px' }}>{eq.emoji}</span><span style={{ color: equipment.includes(eq.id) ? '#00ff00' : '#888' }}>{eq.name}</span></label>))}</div></div>
        <div className="neon-card" style={{ borderRadius: '16px', padding: '20px' }}><h2 style={{ margin: '0 0 16px 0', color: '#ff8000', fontFamily: 'Orbitron, sans-serif' }}>📝 MISSION NOTES</h2><p style={{ color: '#888', marginBottom: '16px', fontSize: '14px' }}>Suggestions and notes for activities.</p>{activitiesWithNotes.length === 0 ? (<div style={{ padding: '20px', textAlign: 'center', color: '#666', backgroundColor: 'rgba(0,0,0,0.3)', borderRadius: '12px' }}>No notes yet. Add suggestions on individual activities!</div>) : (<div>{activitiesWithNotes.map(activity => (<div key={activity.id} style={{ padding: '16px', backgroundColor: 'rgba(0,0,0,0.3)', borderRadius: '12px', marginBottom: '8px', border: '1px solid #333' }}><div style={{ fontWeight: 'bold', color: '#00ffff', marginBottom: '4px', fontFamily: 'Orbitron, sans-serif' }}>{activity.name}</div><div style={{ color: '#aaa', fontSize: '14px', whiteSpace: 'pre-wrap' }}>💡 {activityNotes[activity.id]}</div></div>))}</div>)}</div>
      </div>);
    };


    // ===== HELPERS =====
    const fmtClock = (s) => `${Math.floor(s / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;
    const fmtDuration = (s) => (s < 90 ? `${s} sec` : `~${Math.round(s / 60)} min`);
    const hasEquipmentFor = (activity, equipment) => activity.equipment.every(eq => equipment.includes(eq));
    const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const getActivity = (id) => ACTIVITY_LIBRARY.find(a => a.id === id);

    // Picks the exercises for one run of a course, using only what this group can do.
    const buildCourseSteps = (course, equipment, players) => {
      const usable = (a) => a && hasEquipmentFor(a, equipment);
      if (course.slots) {
        const chosen = [];
        course.slots.forEach(slot => { const pick = shuffle(slot).map(getActivity).find(a => usable(a) && !chosen.includes(a)); if (pick) chosen.push(pick); });
        return chosen;
      }
      return shuffle(course.pool).map(getActivity).filter(usable).slice(0, course.count);
    };
    const countCourseOptions = (course, equipment) => {
      const ids = course.slots ? [...new Set(course.slots.flat())] : course.pool;
      return ids.map(getActivity).filter(a => a && hasEquipmentFor(a, equipment)).length;
    };

    // Short beeps for the course timer (no files needed).
    let audioCtx = null;
    const unlockAudio = () => { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {} };
    const beep = (freq = 880, ms = 160, delay = 0) => {
      try {
        if (!audioCtx) return;
        const t = audioCtx.currentTime + delay / 1000; const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000); o.start(t); o.stop(t + ms / 1000);
      } catch (e) {}
    };

    // ===== WHAT IT TRAINS (muscles / skills / muscle work) =====
    const TrainsInfo = ({ activity, compact }) => {
      const row = (title, items) => items.length > 0 && (
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: '8px', marginBottom: '6px', flexWrap: compact ? 'wrap' : 'nowrap' }}>
          <div style={{ minWidth: '92px', fontSize: '11px', color: '#888', fontFamily: 'Orbitron, sans-serif', paddingTop: '5px' }}>{title}</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', flex: 1, minWidth: 0 }}>{items}</div>
        </div>
      );
      return (<div style={{ marginBottom: '12px', padding: '12px', borderRadius: '12px', background: 'rgba(0,0,0,0.3)', border: '1px solid #2a2a4a' }}>
        {row('MUSCLE WORK', activity.work.map(w => (<span key={w} className="chip" title={WORK_TYPES[w].info} style={{ color: WORK_TYPES[w].color, border: `1px solid ${WORK_TYPES[w].color}`, fontWeight: 'bold' }}>{WORK_TYPES[w].emoji} {WORK_TYPES[w].label}</span>)))}
        {row('MUSCLES', activity.muscles.map(m => (<span key={m} className="chip" style={{ color: '#fff', background: 'rgba(255,128,0,0.15)', border: '1px solid rgba(255,128,0,0.5)' }}>{MUSCLES[m].emoji} {MUSCLES[m].label}</span>)))}
        {row('SKILLS', activity.skills.map(s => (<span key={s} className="chip" style={{ color: '#fff', background: 'rgba(0,255,255,0.1)', border: '1px solid rgba(0,255,255,0.4)' }}>{SKILLS[s].emoji} {SKILLS[s].label}</span>)))}
      </div>);
    };

    const WorkLegend = () => (<div className="neon-card" style={{ borderRadius: '12px', padding: '14px', marginBottom: '16px', borderColor: '#444' }}>
      <div style={{ fontFamily: 'Orbitron, sans-serif', fontSize: '12px', color: '#00ffff', marginBottom: '8px' }}>TYPES OF MUSCLE WORK</div>
      {Object.entries(WORK_TYPES).map(([id, w]) => (<div key={id} style={{ fontSize: '13px', color: '#bbb', marginBottom: '4px' }}><span style={{ color: w.color, fontWeight: 'bold' }}>{w.emoji} {w.label}</span> — {w.info}</div>))}
    </div>);

    // ===== PER-PLAYER TARGETS (Rookie / Pro / Elite) =====
    const TierTargets = ({ activity, participants, big }) => (
      <div style={{ marginBottom: '14px' }}>
        <div style={{ fontSize: '11px', color: '#888', fontFamily: 'Orbitron, sans-serif', marginBottom: '6px' }}>TARGETS BY AGE</div>
        {TIERS.map(tier => {
          const who = participants.filter(p => getTier(p.age).id === tier.id);
          const active = participants.length === 0 || who.length > 0;
          return (<div key={tier.id} style={{ display: 'flex', alignItems: 'center', gap: '10px', padding: big ? '12px 14px' : '8px 12px', marginBottom: '6px', borderRadius: '10px', background: active ? `${tier.color}14` : 'rgba(0,0,0,0.2)', border: `1px solid ${active ? tier.color : '#2a2a3a'}`, opacity: active ? 1 : 0.45 }}>
            <div style={{ minWidth: big ? '110px' : '92px', color: tier.color, fontFamily: 'Orbitron, sans-serif', fontSize: big ? '13px' : '11px', fontWeight: 'bold' }}>{tier.emoji} {tier.label.toUpperCase()}<div style={{ color: '#777', fontWeight: 'normal', fontSize: '10px' }}>ages {tier.ages}</div></div>
            <div style={{ flex: 1, color: '#fff', fontSize: big ? '18px' : '14px', fontWeight: active ? 'bold' : 'normal' }}>{activity.tiers[tier.id]}</div>
            {who.length > 0 && (<div style={{ display: 'flex', gap: '4px', flexWrap: 'wrap', justifyContent: 'flex-end' }}>{who.map(p => { const av = AVATARS.find(a => a.id === p.avatar); return <span key={p.id} title={p.name} style={{ fontSize: big ? '14px' : '12px', color: '#ddd', whiteSpace: 'nowrap' }}>{av?.emoji} {p.name}</span>; })}</div>)}
          </div>);
        })}
      </div>
    );

    // ===== ACTIVITY CARD =====
    const ActivityCard = ({ activity, isFavorite, onToggleFavorite, onComplete, availableEquipment, participants, activityNotes, onUpdateNote }) => {
      const [showNoteInput, setShowNoteInput] = useState(false);
      const [noteText, setNoteText] = useState(activityNotes[activity.id] || '');
      const hasAllEquipment = hasEquipmentFor(activity, availableEquipment);
      const missingEquipment = activity.equipment.filter(eq => !availableEquipment.includes(eq));
      const eligiblePlayers = participants;
      const usable = hasAllEquipment;
      const difficultyColors = { 'Easy': '#00ff00', 'Medium': '#ffff00', 'Hard': '#ff4040' };
      const handleSaveNote = () => { onUpdateNote(activity.id, noteText); setShowNoteInput(false); };

      return (<div className="neon-card" style={{ borderRadius: '16px', padding: '20px', marginBottom: '16px', opacity: usable ? 1 : 0.5, borderColor: usable ? '#00ffff' : '#444' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' }}>
          <div><h3 style={{ margin: '0 0 8px 0', fontSize: '20px', color: '#fff', fontFamily: 'Orbitron, sans-serif' }}>{activity.name}</h3>
            <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              <span style={{ padding: '4px 12px', borderRadius: '12px', fontSize: '12px', fontWeight: 'bold', color: difficultyColors[activity.difficulty], border: `1px solid ${difficultyColors[activity.difficulty]}`, fontFamily: 'Orbitron, sans-serif' }}>{activity.difficulty} intensity</span>
              <span style={{ padding: '4px 12px', borderRadius: '12px', fontSize: '12px', backgroundColor: 'rgba(255,255,255,0.1)', color: '#aaa' }}>⏱ {fmtDuration(activity.durationSec)}</span>
              <span style={{ padding: '4px 12px', borderRadius: '12px', fontSize: '12px', color: '#00ffff', border: '1px solid #00ffff', fontFamily: 'Orbitron, sans-serif', fontWeight: 'bold' }}>+{activity.points} XP</span>
              {activity.recommendedAge && <span style={{ padding: '4px 12px', borderRadius: '12px', fontSize: '12px', color: '#ff8000', border: '1px solid #ff8000' }}>Best for ages {activity.recommendedAge}+</span>}
            </div></div>
          <button onClick={() => onToggleFavorite(activity.id)} style={{ background: 'none', border: 'none', fontSize: '28px', cursor: 'pointer', padding: '4px', filter: isFavorite ? 'drop-shadow(0 0 10px #ff0080)' : 'none' }}>{isFavorite ? '💖' : '🖤'}</button>
        </div>
        <p style={{ color: '#ccc', marginBottom: '12px', lineHeight: '1.5' }}>{activity.description}</p>
        <TrainsInfo activity={activity} />
        <TierTargets activity={activity} participants={participants} />
        {activity.equipment.length > 0 && (<div style={{ marginBottom: '12px' }}><span style={{ fontSize: '14px', color: '#888' }}>Equipment: </span>{activity.equipment.map(eq => { const equipment = EQUIPMENT_OPTIONS.find(e => e.id === eq); const isMissing = missingEquipment.includes(eq); return <span key={eq} style={{ display: 'inline-block', padding: '4px 8px', margin: '2px 4px', borderRadius: '8px', fontSize: '12px', backgroundColor: isMissing ? 'rgba(255,0,0,0.2)' : 'rgba(0,255,255,0.1)', color: isMissing ? '#ff4444' : '#00ffff', border: `1px solid ${isMissing ? '#ff4444' : '#00ffff'}` }}>{equipment?.emoji} {equipment?.name}</span>; })}</div>)}
        {usable && eligiblePlayers.length > 0 && (<div style={{ marginBottom: '16px' }}><div style={{ fontSize: '14px', color: '#00ffff', marginBottom: '8px', fontFamily: 'Orbitron, sans-serif' }}>TAP TO COMPLETE:</div><div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>{eligiblePlayers.map(p => { const avatar = AVATARS.find(a => a.id === p.avatar); const color = COLOR_OPTIONS.find(c => c.id === p.color) || COLOR_OPTIONS[0]; return (<button key={p.id} onClick={() => onComplete(activity, p.id)} style={{ padding: '10px 16px', borderRadius: '25px', border: `2px solid ${color.primary}`, background: 'transparent', color: color.primary, fontWeight: 'bold', fontSize: '14px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px', boxShadow: color.glow }}><span>{avatar?.emoji}</span><span>{p.name}</span></button>); })}{eligiblePlayers.length > 1 && (<button onClick={() => onComplete(activity, eligiblePlayers.map(p => p.id))} style={{ padding: '10px 20px', borderRadius: '25px', border: '2px solid #ffff00', background: 'transparent', color: '#ffff00', fontWeight: 'bold', fontSize: '14px', cursor: 'pointer', boxShadow: '0 0 20px rgba(255,255,0,0.3)', fontFamily: 'Orbitron, sans-serif' }}>👨‍👩‍👧‍👦 ALL</button>)}</div></div>)}
        {!hasAllEquipment && (<div style={{ padding: '12px', borderRadius: '8px', backgroundColor: 'rgba(255,0,0,0.1)', color: '#ff4444', fontSize: '14px', marginBottom: '16px', border: '1px solid #ff4444' }}>⚠️ Missing equipment — enable it in Command Center</div>)}
        <div style={{ borderTop: '1px solid #333', paddingTop: '12px' }}>{!showNoteInput ? (<button onClick={() => setShowNoteInput(true)} style={{ background: 'none', border: '1px dashed #444', borderRadius: '8px', padding: '8px 16px', color: '#666', fontSize: '14px', cursor: 'pointer', width: '100%', textAlign: 'left' }}>{activityNotes[activity.id] ? `📝 ${activityNotes[activity.id]}` : '💡 Add suggestion or note...'}</button>) : (<div><textarea value={noteText} onChange={(e) => setNoteText(e.target.value)} placeholder="Add your suggestions..." style={{ width: '100%', padding: '12px', borderRadius: '8px', border: '2px solid #00ffff', fontSize: '14px', minHeight: '80px', resize: 'vertical', boxSizing: 'border-box', background: 'rgba(0,0,0,0.5)', color: '#fff' }} /><div style={{ display: 'flex', gap: '8px', marginTop: '8px' }}><button onClick={handleSaveNote} style={{ padding: '8px 16px', borderRadius: '8px', border: '2px solid #00ffff', background: 'transparent', color: '#00ffff', fontWeight: 'bold', cursor: 'pointer' }}>Save</button><button onClick={() => { setShowNoteInput(false); setNoteText(activityNotes[activity.id] || ''); }} style={{ padding: '8px 16px', borderRadius: '8px', border: '1px solid #444', background: 'transparent', color: '#888', cursor: 'pointer' }}>Cancel</button></div></div>)}</div>
      </div>);
    };

    // ===== COURSES: list =====
    const CoursesView = ({ equipment, participants, onPick }) => (<div>
      <h1 style={{ fontSize: '28px', margin: '0 0 8px 0', color: '#00ffff', fontFamily: 'Orbitron, sans-serif', textShadow: '0 0 20px #00ffff' }}>🧭 COURSES</h1>
      <p style={{ color: '#888', marginBottom: '20px' }}>A guided set of exercises with a timer. Each player gets targets for their age.</p>
      {participants.length === 0 && <div style={{ padding: '14px', borderRadius: '10px', border: '1px solid #ff8000', color: '#ff8000', marginBottom: '16px' }}>Add pilots in Command Center first.</div>}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(230px, 1fr))', gap: '14px' }}>
        {COURSES.map(course => { const n = countCourseOptions(course, equipment); const enough = n >= Math.min(3, course.count); return (
          <button key={course.id} onClick={() => onPick(course)} disabled={participants.length === 0} style={{ textAlign: 'left', padding: '18px', borderRadius: '16px', border: `2px solid ${enough ? course.color : '#444'}`, background: 'linear-gradient(135deg, rgba(10,10,30,0.95) 0%, rgba(20,20,50,0.95) 100%)', color: '#fff', cursor: participants.length ? 'pointer' : 'not-allowed', boxShadow: enough ? `0 0 20px ${course.color}40` : 'none', opacity: enough ? 1 : 0.6 }}>
            <div style={{ fontSize: '34px', marginBottom: '6px' }}>{course.emoji}</div>
            <div style={{ fontFamily: 'Orbitron, sans-serif', fontWeight: 'bold', color: course.color, fontSize: '16px', marginBottom: '4px' }}>{course.name}</div>
            <div style={{ color: '#aaa', fontSize: '13px', marginBottom: '8px' }}>{course.description}</div>
            <div style={{ fontSize: '12px', color: enough ? '#888' : '#ff8000' }}>{n === 0 ? 'Needs equipment — tap to see what' : `${course.count} exercises · ${n} available with your gear`}</div>
          </button>); })}
      </div>
    </div>);

    // ===== COURSES: setup (pick players, preview steps) =====
    const CourseSetup = ({ course, participants, equipment, onToggleEquipment, onStart, onClose }) => {
      const [playerIds, setPlayerIds] = useState(participants.map(p => p.id));
      const players = participants.filter(p => playerIds.includes(p.id));
      const [steps, setSteps] = useState(() => buildCourseSteps(course, equipment, participants));
      useEffect(() => { setSteps(buildCourseSteps(course, equipment, players)); }, [playerIds.join(','), equipment.join(',')]);
      // Which missing gear would unlock more of this course?
      const poolIds = course.slots ? [...new Set(course.slots.flat())] : course.pool;
      const unlocks = {};
      poolIds.map(getActivity).filter(a => a && !hasEquipmentFor(a, equipment)).forEach(a => a.equipment.filter(eq => !equipment.includes(eq)).forEach(eq => { unlocks[eq] = (unlocks[eq] || 0) + 1; }));
      const unlockList = Object.entries(unlocks).sort((a, b) => b[1] - a[1]);
      const total = steps.reduce((s, a) => s + a.durationSec, 0) + steps.length * 15;
      const toggle = (id) => setPlayerIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      return (<div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.92)', zIndex: 1001, overflowY: 'auto', padding: '20px' }}>
        <div className="neon-card" style={{ maxWidth: '640px', margin: '20px auto', borderRadius: '20px', padding: '24px', borderColor: course.color }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}><h2 style={{ color: course.color, fontFamily: 'Orbitron, sans-serif', margin: 0 }}>{course.emoji} {course.name}</h2><button onClick={onClose} style={{ background: 'none', border: 'none', color: '#888', fontSize: '24px', cursor: 'pointer' }}>✕</button></div>
          <p style={{ color: '#aaa', marginBottom: '18px' }}>{course.description}</p>
          <div style={{ fontFamily: 'Orbitron, sans-serif', fontSize: '12px', color: '#888', marginBottom: '8px' }}>WHO'S PLAYING?</div>
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '20px' }}>{participants.map(p => { const on = playerIds.includes(p.id); const av = AVATARS.find(a => a.id === p.avatar); const color = COLOR_OPTIONS.find(c => c.id === p.color) || COLOR_OPTIONS[0]; const tier = getTier(p.age); return (<button key={p.id} onClick={() => toggle(p.id)} style={{ padding: '10px 14px', borderRadius: '14px', border: `2px solid ${on ? color.primary : '#333'}`, background: on ? `${color.primary}18` : 'transparent', color: on ? color.primary : '#666', cursor: 'pointer', fontWeight: 'bold' }}>{on ? '✓ ' : ''}{av?.emoji} {p.name} <span style={{ fontSize: '11px', color: tier.color }}>{tier.label}</span></button>); })}</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}><div style={{ fontFamily: 'Orbitron, sans-serif', fontSize: '12px', color: '#888' }}>THE PLAN · {fmtDuration(total)}</div><button onClick={() => setSteps(buildCourseSteps(course, equipment, players))} style={{ padding: '6px 14px', borderRadius: '10px', border: '1px solid #00ffff', background: 'transparent', color: '#00ffff', cursor: 'pointer', fontSize: '13px' }}>🔀 Shuffle</button></div>
          {steps.length === 0 ? (<div style={{ padding: '16px', color: '#ff8000', border: '1px solid #ff8000', borderRadius: '10px', marginBottom: '16px' }}>{players.length === 0 ? 'Pick at least one player.' : 'No exercises available yet — this course needs equipment you haven’t checked off. Tap what you have:'}</div>) : (
            <ol style={{ listStyle: 'none', marginBottom: '16px' }}>{steps.map((a, i) => (<li key={a.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 12px', marginBottom: '6px', borderRadius: '10px', background: 'rgba(0,0,0,0.3)', border: '1px solid #2a2a4a', color: '#ddd' }}><span><span style={{ color: course.color, fontFamily: 'Orbitron, sans-serif', marginRight: '10px' }}>{i + 1}</span>{a.name}<span style={{ color: '#777', fontSize: '12px', marginLeft: '8px' }}>{a.work.map(w => WORK_TYPES[w].emoji).join(' ')} {a.muscles.slice(0, 3).map(m => MUSCLES[m].label).join(', ')}</span></span><span style={{ color: '#888', fontSize: '13px', whiteSpace: 'nowrap' }}>{fmtDuration(a.durationSec)}</span></li>))}</ol>)}
          {steps.length > 0 && steps.length < course.count && <div style={{ color: '#ff8000', fontSize: '13px', marginBottom: '8px' }}>Only {steps.length} of {course.count} exercises fit your equipment. Have any of these?</div>}
          {players.length > 0 && steps.length < course.count && unlockList.length > 0 && (<div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '16px' }}>{unlockList.map(([eq, n]) => { const item = EQUIPMENT_OPTIONS.find(e => e.id === eq); return (<button key={eq} onClick={() => onToggleEquipment(eq)} style={{ padding: '8px 12px', borderRadius: '10px', border: '1px dashed #00ff00', background: 'transparent', color: '#00ff00', cursor: 'pointer', fontSize: '13px' }}>+ {item?.emoji} {item?.name} <span style={{ color: '#888' }}>(unlocks {n})</span></button>); })}</div>)}
          <button disabled={players.length === 0 || steps.length === 0} onClick={() => { unlockAudio(); onStart(steps, playerIds); }} className="arcade-btn" style={{ width: '100%', padding: '18px', fontSize: '18px', border: `3px solid ${course.color}`, borderRadius: '14px', background: 'transparent', color: course.color, cursor: 'pointer', fontFamily: 'Orbitron, sans-serif', boxShadow: `0 0 30px ${course.color}50`, opacity: players.length && steps.length ? 1 : 0.4 }}>🚀 START COURSE</button>
        </div>
      </div>);
    };

    // ===== COURSES: guided runner with timer =====
    const REST_SEC = 15, GET_READY_SEC = 10;
    const CourseRunner = ({ course, steps, players, onStepDone, onFinish, onExit }) => {
      const [index, setIndex] = useState(0);
      const [phase, setPhase] = useState('ready'); // ready → work → rest → work … → done
      const [remaining, setRemaining] = useState(GET_READY_SEC);
      const [paused, setPaused] = useState(false);
      const [results, setResults] = useState([]);
      const [confirmExit, setConfirmExit] = useState(false);
      const step = steps[index];
      const timing = phase === 'ready' || phase === 'work' || phase === 'rest';

      useEffect(() => {
        if (!timing || paused || remaining <= 0) return;
        const t = setTimeout(() => setRemaining(r => r - 1), 1000);
        return () => clearTimeout(t);
      }, [remaining, paused, phase]);

      useEffect(() => {
        if (!timing || paused) return;
        if (remaining > 0 && remaining <= 3 && phase !== 'work') beep(660, 120);
        if (remaining !== 0) return;
        if (phase === 'ready' || phase === 'rest') { beep(990, 300); setPhase('work'); setRemaining(step.durationSec); }
        else if (phase === 'work') { beep(880, 200); beep(880, 200, 300); beep(1100, 400, 600); }
      }, [remaining, phase, paused]);

      const advance = (status) => {
        setResults(prev => [...prev, { activity: step, status }]);
        if (status === 'done') onStepDone(step, players.map(p => p.id));
        setPaused(false);
        if (index + 1 >= steps.length) { setPhase('done'); return; }
        setIndex(index + 1); setPhase('rest'); setRemaining(REST_SEC);
      };

      const doneCount = results.filter(r => r.status === 'done').length;
      const bonus = doneCount > 0 ? 15 + doneCount * 5 : 0;
      const totalTime = phase === 'work' ? step.durationSec : phase === 'rest' ? REST_SEC : GET_READY_SEC;
      const pct = timing ? Math.max(0, remaining) / totalTime : 0;
      const timeUp = phase === 'work' && remaining <= 0;
      const ringColor = phase === 'work' ? (timeUp ? '#ff4040' : course.color) : '#888';
      const btn = (color) => ({ padding: '16px 22px', fontSize: '16px', border: `2px solid ${color}`, borderRadius: '14px', background: 'transparent', color, cursor: 'pointer', fontFamily: 'Orbitron, sans-serif', fontWeight: 'bold', flex: 1, minWidth: '120px' });

      return (<div style={{ position: 'fixed', inset: 0, background: 'linear-gradient(180deg, #0a0a1a 0%, #12122a 100%)', zIndex: 1001, overflowY: 'auto' }}>
        <div style={{ maxWidth: '720px', margin: '0 auto', padding: '20px 20px 40px' }}>
          {/* header + progress */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
            <div style={{ fontFamily: 'Orbitron, sans-serif', color: course.color, fontWeight: 'bold' }}>{course.emoji} {course.name}</div>
            {phase !== 'done' && (confirmExit ? (<div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}><span style={{ color: '#aaa', fontSize: '13px' }}>End course?</span><button onClick={onExit} style={{ padding: '6px 12px', borderRadius: '8px', border: '1px solid #ff4040', background: 'transparent', color: '#ff4040', cursor: 'pointer' }}>Yes, exit</button><button onClick={() => setConfirmExit(false)} style={{ padding: '6px 12px', borderRadius: '8px', border: '1px solid #666', background: 'transparent', color: '#aaa', cursor: 'pointer' }}>No</button></div>) : (<button onClick={() => { setConfirmExit(true); setPaused(true); }} style={{ padding: '6px 14px', borderRadius: '8px', border: '1px solid #666', background: 'transparent', color: '#aaa', cursor: 'pointer' }}>✕ Exit</button>))}
          </div>
          <div style={{ display: 'flex', gap: '4px', marginBottom: '24px' }}>{steps.map((s, i) => { const r = results[i]; const bg = r ? (r.status === 'done' ? course.color : '#555') : i === index && phase !== 'done' ? `${course.color}66` : 'rgba(255,255,255,0.1)'; return <div key={i} style={{ flex: 1, height: '8px', borderRadius: '4px', background: bg, boxShadow: r?.status === 'done' ? `0 0 8px ${course.color}` : 'none' }} />; })}</div>

          {phase === 'done' ? (
            <div className="neon-card" style={{ borderRadius: '20px', padding: '32px', textAlign: 'center', borderColor: course.color }}>
              <div style={{ fontSize: '72px', marginBottom: '10px' }}>🏁</div>
              <h2 style={{ fontFamily: 'Orbitron, sans-serif', color: course.color, marginBottom: '8px' }}>COURSE COMPLETE!</h2>
              <p style={{ color: '#aaa', marginBottom: '18px' }}>{doneCount} of {steps.length} exercises done</p>
              <div style={{ textAlign: 'left', marginBottom: '20px' }}>{results.map((r, i) => (<div key={i} style={{ display: 'flex', justifyContent: 'space-between', padding: '8px 12px', borderBottom: '1px solid #222', color: r.status === 'done' ? '#ddd' : '#666' }}><span>{r.status === 'done' ? '✅' : '⏭'} {r.activity.name}</span><span style={{ fontFamily: 'Orbitron, sans-serif', fontSize: '13px', color: r.status === 'done' ? '#00ff00' : '#666' }}>{r.status === 'done' ? `+${r.activity.points}` : 'skipped'}</span></div>))}</div>
              {bonus > 0 && <div style={{ fontFamily: 'Orbitron, sans-serif', fontSize: '22px', color: '#ffff00', textShadow: '0 0 15px #ffff00', marginBottom: '20px' }}>COURSE BONUS +{bonus} XP each</div>}
              <button onClick={() => onFinish(bonus, doneCount)} className="arcade-btn" style={{ ...btn('#00ff00'), width: '100%' }}>{bonus > 0 ? 'COLLECT BONUS 🎉' : 'BACK TO BASE'}</button>
            </div>
          ) : (<>
            <div style={{ textAlign: 'center', marginBottom: '6px', color: '#888', fontFamily: 'Orbitron, sans-serif', fontSize: '13px', letterSpacing: '2px' }}>
              {phase === 'ready' ? 'GET READY' : phase === 'rest' ? 'REST — UP NEXT' : `EXERCISE ${index + 1} OF ${steps.length}`}
            </div>
            <h1 style={{ textAlign: 'center', fontFamily: 'Orbitron, sans-serif', color: '#fff', fontSize: '28px', marginBottom: '16px' }}>{step.name}</h1>

            {/* timer ring */}
            <div style={{ position: 'relative', width: '190px', height: '190px', margin: '0 auto 18px' }}>
              <svg width="190" height="190" viewBox="0 0 190 190" style={{ transform: 'rotate(-90deg)' }}>
                <circle cx="95" cy="95" r="84" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="10" />
                <circle cx="95" cy="95" r="84" fill="none" stroke={ringColor} strokeWidth="10" strokeLinecap="round" strokeDasharray={2 * Math.PI * 84} strokeDashoffset={2 * Math.PI * 84 * (1 - pct)} style={{ transition: 'stroke-dashoffset 1s linear', filter: `drop-shadow(0 0 8px ${ringColor})` }} />
              </svg>
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                <div style={{ fontFamily: 'Orbitron, sans-serif', fontSize: timeUp ? '30px' : '46px', fontWeight: 'bold', color: ringColor, animation: timeUp || paused ? 'timeUp 1s infinite' : 'none' }}>{timeUp ? 'TIME!' : fmtClock(remaining)}</div>
                {paused && <div style={{ color: '#ffff00', fontFamily: 'Orbitron, sans-serif', fontSize: '13px' }}>PAUSED</div>}
              </div>
            </div>

            {/* controls */}
            <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '22px' }}>
              {!timeUp && <button onClick={() => setPaused(p => !p)} style={btn('#ffff00')}>{paused ? '▶ RESUME' : '⏸ PAUSE'}</button>}
              {phase === 'work' ? (<>
                <button onClick={() => advance('done')} style={btn('#00ff00')}>✓ DONE</button>
                <button onClick={() => advance('skipped')} style={btn('#888')}>⏭ SKIP</button>
              </>) : (<button onClick={() => { setPhase('work'); setRemaining(step.durationSec); setPaused(false); beep(990, 300); }} style={btn('#00ffff')}>▶ START NOW</button>)}
            </div>
            {timeUp && <p style={{ textAlign: 'center', color: '#ff8080', marginTop: '-10px', marginBottom: '18px' }}>Time’s up! Tap DONE if you finished your target, or SKIP.</p>}

            <p style={{ color: '#ccc', lineHeight: 1.5, marginBottom: '14px', fontSize: '16px' }}>{step.description}</p>
            <TierTargets activity={step} participants={players} big />
            <TrainsInfo activity={step} />
          </>)}
        </div>
      </div>);
    };

    const loadJSON = (key, fallback) => { try { const saved = localStorage.getItem(key); return saved ? JSON.parse(saved) : fallback; } catch (e) { return fallback; } };
    const saveJSON = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} };

    function App() {
      const [view, setView] = useState('dashboard');
      const [selectedParticipant, setSelectedParticipant] = useState(null);
      const [showConfetti, setShowConfetti] = useState(false);
      const [popupQueue, setPopupQueue] = useState([]); // badges + level-ups, shown one at a time
      const [pointsPopup, setPointsPopup] = useState(null);
      const [showWheel, setShowWheel] = useState(false);
      const [activityFilter, setActivityFilter] = useState('all');
      const [focusFilter, setFocusFilter] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [showLegend, setShowLegend] = useState(false);
      const [courseSetup, setCourseSetup] = useState(null);
      const [courseRun, setCourseRun] = useState(null);

      const [participants, setParticipants] = useState(() => loadJSON('gymAdventure_participants', []));
      const [equipment, setEquipment] = useState(() => loadJSON('gymAdventure_equipment', []));
      const [favorites, setFavorites] = useState(() => loadJSON('gymAdventure_favorites', []));
      const [completionHistory, setCompletionHistory] = useState(() => loadJSON('gymAdventure_history', []));
      const [activityNotes, setActivityNotes] = useState(() => loadJSON('gymAdventure_notes', {}));

      useEffect(() => saveJSON('gymAdventure_participants', participants), [participants]);
      useEffect(() => saveJSON('gymAdventure_equipment', equipment), [equipment]);
      useEffect(() => saveJSON('gymAdventure_favorites', favorites), [favorites]);
      useEffect(() => saveJSON('gymAdventure_history', completionHistory), [completionHistory]);
      useEffect(() => saveJSON('gymAdventure_notes', activityNotes), [activityNotes]);

      const getParticipantStats = (participant) => {
        const completed = participant.completedActivities || [];
        const byCat = (cat) => completed.filter(c => getActivity(c.activityId)?.category === cat).length;
        const courses = participant.coursesCompleted || [];
        return {
          totalCompleted: completed.length, totalPoints: participant.xp || 0,
          balanceCompleted: byCat('balance'), jumpCompleted: byCat('jump'), strengthCompleted: byCat('strength'), danceCompleted: byCat('dance'),
          yogaCompleted: byCat('yoga'), obstacleCompleted: byCat('obstacle'), coreCompleted: byCat('core'), cardioCompleted: byCat('cardio'), agilityCompleted: byCat('agility'),
          teamCompleted: completed.filter(c => getActivity(c.activityId)?.tags?.includes('team')).length,
          favoritesCount: favorites.length, uniqueActivities: new Set(completed.map(c => c.activityId)).size,
          uniqueDays: new Set(completed.map(c => new Date(c.date).toDateString())).size,
          coursesCompleted: courses.length, uniqueCourses: new Set(courses).size,
        };
      };

      // Gives XP to players, checks levels and badges. `extra(p)` can change the player record (e.g. log an activity).
      const award = (ids, points, extra, historyName, opts = {}) => {
        const unlocks = [];
        const names = [];
        const updated = participants.map(p => {
          if (!ids.includes(p.id)) return p;
          const prevLevel = LEVELS.filter(l => (p.xp || 0) >= l.minXP).pop();
          let u = extra({ ...p, xp: (p.xp || 0) + points });
          const newLevel = LEVELS.filter(l => u.xp >= l.minXP).pop();
          if (newLevel.level > prevLevel.level) unlocks.push({ type: 'level', data: newLevel, who: p.name });
          const stats = getParticipantStats(u);
          const newBadges = BADGES.filter(b => !(u.earnedBadges || []).includes(b.id) && b.condition(stats));
          if (newBadges.length) { u = { ...u, earnedBadges: [...(u.earnedBadges || []), ...newBadges.map(b => b.id)] }; newBadges.forEach(b => unlocks.push({ type: 'badge', data: b, who: p.name })); }
          const count = (u.completedActivities || []).length;
          const avatarBadges = AVATAR_BADGES.filter(b => b.avatarId === u.avatar && !(u.avatarBadges || []).includes(b.id) && count >= b.threshold);
          if (avatarBadges.length) { u = { ...u, avatarBadges: [...(u.avatarBadges || []), ...avatarBadges.map(b => b.id)] }; avatarBadges.forEach(b => unlocks.push({ type: 'badge', data: b, who: p.name })); }
          names.push(p.name);
          return u;
        });
        setParticipants(updated);
        const now = new Date().toISOString();
        setCompletionHistory(prev => [...prev, ...participants.filter(p => ids.includes(p.id)).map(p => ({ participantId: p.id, participantName: p.name, activityName: historyName, points, date: now }))]);
        if (unlocks.length) setTimeout(() => setPopupQueue(q => [...q, ...unlocks]), opts.quiet ? 300 : 1700);
        if (!opts.quiet) { setPointsPopup({ points, participantName: names.length > 1 ? 'Everyone' : names[0] }); setShowConfetti(true); setTimeout(() => setShowConfetti(false), 3000); }
      };

      const completeActivity = (activity, idOrIds, opts) => {
        const ids = Array.isArray(idOrIds) ? idOrIds : [idOrIds];
        award(ids, activity.points, (u) => ({ ...u, completedActivities: [...(u.completedActivities || []), { activityId: activity.id, date: new Date().toISOString(), points: activity.points }] }), activity.name, opts);
      };
      const finishCourse = (bonus, doneCount) => {
        const { course, playerIds } = courseRun;
        setCourseRun(null); setView('dashboard');
        if (doneCount === 0) return;
        award(playerIds, bonus, (u) => ({ ...u, coursesCompleted: [...(u.coursesCompleted || []), course.id] }), `🏁 ${course.name} course`);
      };

      const toggleFavorite = (activityId) => setFavorites(prev => prev.includes(activityId) ? prev.filter(id => id !== activityId) : [...prev, activityId]);
      const saveParticipant = (data) => { const existing = participants.find(p => p.id === data.id); if (existing) { setParticipants(prev => prev.map(p => p.id === data.id ? { ...p, ...data } : p)); } else { if (participants.length >= 4) return; setParticipants(prev => [...prev, data]); } };
      const deleteParticipant = (id) => setParticipants(prev => prev.filter(p => p.id !== id));
      const toggleEquipment = (id) => setEquipment(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      const updateActivityNote = (activityId, note) => { setActivityNotes(prev => { if (!note || note.trim() === '') { const { [activityId]: removed, ...rest } = prev; return rest; } return { ...prev, [activityId]: note }; }); };
      const getEligibleActivities = () => ACTIVITY_LIBRARY.filter(a => hasEquipmentFor(a, equipment));
      const matchesFocus = (a) => { if (!focusFilter) return true; const [kind, id] = focusFilter.split(':'); return kind === 'm' ? a.muscles.includes(id) : kind === 's' ? a.skills.includes(id) : a.work.includes(id); };
      const getFilteredActivities = () => {
        let filtered = ACTIVITY_LIBRARY.filter(a => (activityFilter === 'all' || a.category === activityFilter) && matchesFocus(a));
        if (searchQuery) { const q = searchQuery.toLowerCase(); filtered = filtered.filter(a => a.name.toLowerCase().includes(q) || a.description.toLowerCase().includes(q)); }
        const usable = (a) => hasEquipmentFor(a, equipment);
        return [...filtered].sort((a, b) => (usable(a) === usable(b) ? 0 : usable(a) ? -1 : 1));
      };

      const currentPopup = courseRun ? null : popupQueue[0]; // hold badge/level popups until a course ends
      const closePopup = () => setPopupQueue(q => q.slice(1));
      const runPlayers = courseRun ? participants.filter(p => courseRun.playerIds.includes(p.id)) : [];

      const bigBtn = (color) => ({ padding: '18px', fontSize: '15px', border: `2px solid ${color}`, borderRadius: '12px', background: 'transparent', color, cursor: 'pointer', fontFamily: 'Orbitron, sans-serif', boxShadow: `0 0 20px ${color}33` });

      const renderDashboard = () => (<div>
        <div style={{ textAlign: 'center', marginBottom: '40px' }}><h1 style={{ fontSize: '38px', margin: '0 0 8px 0', fontFamily: 'Orbitron, sans-serif', background: 'linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ffff)', backgroundSize: '300% 100%', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', animation: 'shimmer 3s linear infinite' }}>🦖 HOME GYM ADVENTURE 🦋</h1><p style={{ color: '#888', margin: 0, fontFamily: 'Orbitron, sans-serif', fontSize: '14px', letterSpacing: '3px' }}>SPACE • DINOS • FITNESS</p></div>
        {participants.length === 0 ? (<div className="neon-card" style={{ textAlign: 'center', padding: '50px', borderRadius: '20px', marginBottom: '24px' }}><div style={{ fontSize: '80px', marginBottom: '20px', animation: 'float 2s ease-in-out infinite' }}>🦕</div><h2 style={{ color: '#00ffff', marginBottom: '12px', fontFamily: 'Orbitron, sans-serif' }}>NO PILOTS DETECTED!</h2><p style={{ color: '#888', marginBottom: '28px' }}>Register pilots in Command Center to begin.</p><button onClick={() => setView('settings')} className="arcade-btn" style={{ padding: '18px 40px', fontSize: '16px', border: '2px solid #00ffff', borderRadius: '30px', background: 'transparent', color: '#00ffff', cursor: 'pointer', fontFamily: 'Orbitron, sans-serif', boxShadow: '0 0 30px rgba(0,255,255,0.3)' }}>COMMAND CENTER ⚙️</button></div>) : (<>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '16px', marginBottom: '32px' }}>{participants.map(p => <ParticipantCard key={p.id} participant={p} onClick={() => { setSelectedParticipant(p); setView('participant'); }} />)}</div>
          <button onClick={() => setView('courses')} className="arcade-btn" style={{ width: '100%', padding: '22px', fontSize: '20px', border: '3px solid #00ff80', borderRadius: '16px', background: 'linear-gradient(135deg, rgba(0,255,128,0.1) 0%, rgba(0,255,255,0.1) 100%)', color: '#00ff80', cursor: 'pointer', marginBottom: '14px', fontFamily: 'Orbitron, sans-serif', boxShadow: '0 0 40px rgba(0,255,128,0.3)', letterSpacing: '3px' }}>🧭 START A COURSE</button>
          <button onClick={() => setView('activities')} className="arcade-btn" style={{ width: '100%', padding: '18px', fontSize: '17px', border: '3px solid #ff00ff', borderRadius: '16px', background: 'linear-gradient(135deg, rgba(255,0,255,0.1) 0%, rgba(255,0,128,0.1) 100%)', color: '#ff00ff', cursor: 'pointer', marginBottom: '14px', fontFamily: 'Orbitron, sans-serif', boxShadow: '0 0 30px rgba(255,0,255,0.3)', letterSpacing: '3px' }}>🎯 PICK A MISSION</button>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <button onClick={() => { if (getEligibleActivities().length > 0) setShowWheel(true); else setView('settings'); }} className="arcade-btn" style={bigBtn('#00ffff')}>🎲 RANDOM</button>
            <button onClick={() => setView('favorites')} className="arcade-btn" style={bigBtn('#ff0080')}>💖 FAVORITES ({favorites.length})</button>
          </div></>)}
        {completionHistory.length > 0 && (<div style={{ marginTop: '32px' }}><h2 style={{ color: '#00ffff', marginBottom: '16px', fontFamily: 'Orbitron, sans-serif' }}>📜 MISSION LOG</h2><div className="neon-card" style={{ borderRadius: '16px', overflow: 'hidden' }}>{completionHistory.slice(-5).reverse().map((entry, idx) => (<div key={idx} style={{ padding: '16px', borderBottom: idx < 4 ? '1px solid #222' : 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div style={{ color: '#aaa' }}><strong style={{ color: '#fff' }}>{entry.participantName}</strong> completed <span style={{ color: '#00ffff' }}>{entry.activityName}</span></div><span style={{ padding: '4px 12px', borderRadius: '12px', backgroundColor: 'rgba(0,255,0,0.1)', color: '#00ff00', fontSize: '14px', fontWeight: 'bold', border: '1px solid #00ff00', fontFamily: 'Orbitron, sans-serif' }}>+{entry.points}</span></div>))}</div></div>)}
      </div>);

      const renderActivities = () => {
        const list = getFilteredActivities();
        return (<div>
          <h1 style={{ fontSize: '28px', margin: '0 0 16px 0', color: '#00ffff', fontFamily: 'Orbitron, sans-serif', textShadow: '0 0 20px #00ffff' }}>🎯 SELECT MISSION</h1>
          <input type="text" placeholder="Search missions..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ width: '100%', padding: '14px 20px', fontSize: '16px', border: '2px solid #00ffff', borderRadius: '12px', marginBottom: '12px', boxSizing: 'border-box', background: 'rgba(0,0,0,0.5)', color: '#fff' }} />
          <div style={{ display: 'flex', gap: '8px', marginBottom: '12px', flexWrap: 'wrap' }}>
            <select value={focusFilter} onChange={(e) => setFocusFilter(e.target.value)} style={{ flex: 1, minWidth: '200px', padding: '12px', fontSize: '15px', borderRadius: '12px', border: '2px solid #ff8000', background: '#111122', color: focusFilter ? '#ff8000' : '#aaa' }}>
              <option value="">🎯 Any focus (muscle, skill, work type)</option>
              <optgroup label="Muscles">{Object.entries(MUSCLES).map(([id, m]) => <option key={id} value={`m:${id}`}>{m.emoji} {m.label}</option>)}</optgroup>
              <optgroup label="Skills">{Object.entries(SKILLS).map(([id, s]) => <option key={id} value={`s:${id}`}>{s.emoji} {s.label}</option>)}</optgroup>
              <optgroup label="Muscle work">{Object.entries(WORK_TYPES).map(([id, w]) => <option key={id} value={`w:${id}`}>{w.emoji} {w.label}</option>)}</optgroup>
            </select>
            <button onClick={() => setShowLegend(s => !s)} style={{ padding: '12px 16px', borderRadius: '12px', border: '1px solid #444', background: 'transparent', color: '#aaa', cursor: 'pointer' }}>{showLegend ? 'Hide' : '❓ What do the labels mean?'}</button>
          </div>
          {showLegend && <WorkLegend />}
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '16px' }}>{CATEGORIES.map(cat => (<button key={cat.id} onClick={() => setActivityFilter(cat.id)} style={{ padding: '8px 14px', borderRadius: '20px', border: activityFilter === cat.id ? '2px solid #00ffff' : '1px solid #444', background: activityFilter === cat.id ? 'rgba(0,255,255,0.1)' : 'transparent', color: activityFilter === cat.id ? '#00ffff' : '#888', fontWeight: 'bold', fontSize: '13px', cursor: 'pointer', boxShadow: activityFilter === cat.id ? '0 0 15px rgba(0,255,255,0.3)' : 'none' }}>{cat.label}</button>))}</div>
          <div style={{ color: '#666', fontSize: '13px', marginBottom: '12px' }}>{list.length} missions</div>
          {list.map(activity => (<ActivityCard key={activity.id} activity={activity} isFavorite={favorites.includes(activity.id)} onToggleFavorite={toggleFavorite} onComplete={completeActivity} availableEquipment={equipment} participants={participants} activityNotes={activityNotes} onUpdateNote={updateActivityNote} />))}
        </div>);
      };

      const renderFavorites = () => { const favoriteActivities = ACTIVITY_LIBRARY.filter(a => favorites.includes(a.id)); return (<div><h1 style={{ fontSize: '28px', margin: '0 0 24px 0', color: '#00ffff', fontFamily: 'Orbitron, sans-serif', textShadow: '0 0 20px #00ffff' }}>💖 FAVORITE MISSIONS</h1>{favoriteActivities.length === 0 ? (<div className="neon-card" style={{ textAlign: 'center', padding: '50px', borderRadius: '16px' }}><div style={{ fontSize: '64px', marginBottom: '16px' }}>💔</div><h2 style={{ color: '#ff0080', marginBottom: '8px', fontFamily: 'Orbitron, sans-serif' }}>NO FAVORITES YET!</h2><p style={{ color: '#888' }}>Tap the heart on missions to save them here.</p></div>) : favoriteActivities.map(activity => (<ActivityCard key={activity.id} activity={activity} isFavorite={true} onToggleFavorite={toggleFavorite} onComplete={completeActivity} availableEquipment={equipment} participants={participants} activityNotes={activityNotes} onUpdateNote={updateActivityNote} />))}</div>); };

      const renderParticipantDetail = () => {
        if (!selectedParticipant) return null;
        const participant = participants.find(p => p.id === selectedParticipant.id); if (!participant) return null;
        const avatar = AVATARS.find(a => a.id === participant.avatar);
        const color = COLOR_OPTIONS.find(c => c.id === participant.color) || COLOR_OPTIONS[0];
        const currentLevel = LEVELS.filter(l => participant.xp >= l.minXP).pop();
        const nextLevel = LEVELS.find(l => l.minXP > participant.xp);
        const progressToNext = nextLevel ? ((participant.xp - currentLevel.minXP) / (nextLevel.minXP - currentLevel.minXP)) * 100 : 100;
        const stats = getParticipantStats(participant);
        const tier = getTier(participant.age);
        const avatarSpecificBadges = AVATAR_BADGES.filter(b => b.avatarId === participant.avatar);
        // What this player has trained most (muscle groups)
        const muscleCounts = {};
        (participant.completedActivities || []).forEach(c => (getActivity(c.activityId)?.muscles || []).forEach(m => { muscleCounts[m] = (muscleCounts[m] || 0) + 1; }));
        const topMuscles = Object.entries(muscleCounts).sort((a, b) => b[1] - a[1]);
        const maxCount = topMuscles[0]?.[1] || 1;
        const statBox = (emoji, value, label, c) => (<div className="neon-card" style={{ borderRadius: '12px', padding: '16px', textAlign: 'center', borderColor: c }}><div style={{ fontSize: '28px', marginBottom: '4px' }}>{emoji}</div><div style={{ fontSize: '22px', fontWeight: 'bold', color: c, fontFamily: 'Orbitron, sans-serif' }}>{value}</div><div style={{ fontSize: '11px', color: '#888', textTransform: 'uppercase' }}>{label}</div></div>);

        return (<div>
          <div style={{ background: 'linear-gradient(135deg, rgba(10,10,30,0.95) 0%, rgba(20,20,50,0.95) 100%)', border: `3px solid ${color.primary}`, borderRadius: '24px', padding: '32px', textAlign: 'center', marginBottom: '24px', boxShadow: `0 0 50px ${color.primary}40` }}>
            <div style={{ width: '110px', height: '110px', borderRadius: '50%', backgroundColor: `${color.primary}20`, border: `3px solid ${color.primary}`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '60px', margin: '0 auto 16px', boxShadow: `0 0 30px ${color.primary}60`, animation: 'float 3s ease-in-out infinite' }}>{avatar?.emoji}</div>
            <h1 style={{ margin: '0 0 8px 0', fontSize: '32px', fontFamily: 'Orbitron, sans-serif', color: color.primary, textShadow: `0 0 20px ${color.primary}` }}>{participant.name}</h1>
            <div style={{ fontSize: '16px', color: '#888', marginBottom: '6px' }}>Age {participant.age} • {avatar?.name}</div>
            <div style={{ fontSize: '14px', color: tier.color, marginBottom: '20px', fontFamily: 'Orbitron, sans-serif' }}>{tier.emoji} {tier.label.toUpperCase()} TIER — targets for ages {tier.ages}</div>
            <div style={{ background: 'rgba(0,0,0,0.3)', borderRadius: '16px', padding: '20px', border: `1px solid ${color.primary}40` }}><div style={{ fontSize: '28px', marginBottom: '12px', fontFamily: 'Orbitron, sans-serif' }}><span style={{ marginRight: '8px' }}>{currentLevel?.emoji}</span><span style={{ color: '#ffff00', textShadow: '0 0 10px #ffff00' }}>{currentLevel?.name}</span></div><div style={{ marginBottom: '8px' }}><div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', marginBottom: '6px', fontFamily: 'Orbitron, sans-serif' }}><span style={{ color: color.primary }}>{participant.xp} XP</span>{nextLevel && <span style={{ color: '#666' }}>{nextLevel.minXP} XP</span>}</div><div style={{ height: '10px', backgroundColor: 'rgba(255,255,255,0.1)', borderRadius: '5px', overflow: 'hidden', border: `1px solid ${color.primary}40` }}><div style={{ height: '100%', width: `${progressToNext}%`, background: color.gradient, borderRadius: '5px', boxShadow: `0 0 15px ${color.primary}` }} /></div></div>{nextLevel && <div style={{ fontSize: '13px', color: '#888' }}>{nextLevel.minXP - participant.xp} XP to {nextLevel.name}</div>}</div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '10px', marginBottom: '24px' }}>{statBox('🏆', stats.totalCompleted, 'Completed', '#00ffff')}{statBox('⭐', participant.xp, 'Total XP', '#ffff00')}{statBox('🏁', stats.coursesCompleted, 'Courses', '#00ff80')}{statBox('🏅', (participant.earnedBadges?.length || 0) + (participant.avatarBadges?.length || 0), 'Badges', '#ff00ff')}</div>
          {topMuscles.length > 0 && (<div className="neon-card" style={{ borderRadius: '16px', padding: '18px', marginBottom: '24px', borderColor: '#ff8000' }}><h2 style={{ color: '#ff8000', fontFamily: 'Orbitron, sans-serif', fontSize: '16px', marginBottom: '12px' }}>💪 MUSCLES TRAINED</h2>{topMuscles.map(([m, n]) => (<div key={m} style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}><div style={{ width: '130px', color: '#ccc', fontSize: '13px' }}>{MUSCLES[m].emoji} {MUSCLES[m].label}</div><div style={{ flex: 1, height: '8px', background: 'rgba(255,255,255,0.08)', borderRadius: '4px', overflow: 'hidden' }}><div style={{ width: `${(n / maxCount) * 100}%`, height: '100%', background: '#ff8000', borderRadius: '4px' }} /></div><div style={{ width: '28px', textAlign: 'right', color: '#888', fontSize: '12px' }}>{n}</div></div>))}</div>)}
          <h2 style={{ color: '#ff00ff', marginBottom: '16px', fontFamily: 'Orbitron, sans-serif' }}>🏅 BADGES</h2>
          <div style={{ marginBottom: '16px' }}><h3 style={{ color: '#00ffff', marginBottom: '12px', fontFamily: 'Orbitron, sans-serif', fontSize: '14px' }}>{avatar?.emoji} {avatar?.name.toUpperCase()} PROGRESSION</h3><div style={{ display: 'flex', gap: '12px', marginBottom: '16px' }}>{avatarSpecificBadges.map(badge => { const earned = participant.avatarBadges?.includes(badge.id); return (<div key={badge.id} title={`${badge.name}: ${badge.description}`} className="neon-card" style={{ borderRadius: '12px', padding: '12px', textAlign: 'center', flex: '1', opacity: earned ? 1 : 0.3, borderColor: earned ? color.primary : '#333' }}><div style={{ fontSize: '32px', filter: earned ? `drop-shadow(0 0 10px ${color.primary})` : 'grayscale(100%)' }}>{badge.emoji}</div><div style={{ fontSize: '10px', color: earned ? color.primary : '#666', marginTop: '4px', fontFamily: 'Orbitron, sans-serif' }}>{badge.name}</div><div style={{ fontSize: '9px', color: '#666', marginTop: '2px' }}>({badge.threshold}x)</div></div>); })}</div></div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(75px, 1fr))', gap: '10px', marginBottom: '24px' }}>{BADGES.map(badge => { const earned = participant.earnedBadges?.includes(badge.id); return (<div key={badge.id} title={`${badge.name}: ${badge.description}`} className="neon-card" style={{ borderRadius: '12px', padding: '10px', textAlign: 'center', opacity: earned ? 1 : 0.25, borderColor: earned ? '#00ffff' : '#333' }}><div style={{ fontSize: '28px', filter: earned ? 'drop-shadow(0 0 8px #00ffff)' : 'grayscale(100%)' }}>{badge.emoji}</div><div style={{ fontSize: '9px', color: earned ? '#00ffff' : '#666', marginTop: '4px' }}>{badge.name}</div></div>); })}</div>
          {participant.completedActivities?.length > 0 && (<><h2 style={{ color: '#00ffff', marginBottom: '16px', fontFamily: 'Orbitron, sans-serif' }}>📜 RECENT MISSIONS</h2><div className="neon-card" style={{ borderRadius: '16px', overflow: 'hidden' }}>{participant.completedActivities.slice(-5).reverse().map((completion, idx, arr) => { const activity = getActivity(completion.activityId); return (<div key={idx} style={{ padding: '16px', borderBottom: idx < arr.length - 1 ? '1px solid #222' : 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: 'bold', color: '#fff' }}>{activity?.name}</div><div style={{ fontSize: '12px', color: '#666' }}>{new Date(completion.date).toLocaleDateString()}</div></div><span style={{ padding: '4px 12px', borderRadius: '12px', backgroundColor: 'rgba(0,255,0,0.1)', color: '#00ff00', fontSize: '14px', fontWeight: 'bold', border: '1px solid #00ff00', fontFamily: 'Orbitron, sans-serif' }}>+{completion.points}</span></div>); })}</div></>)}
        </div>);
      };

      return (<div style={{ minHeight: '100vh', position: 'relative', zIndex: 2 }}>
        <StarField /><div className="grid-overlay" /><div className="scanlines" />
        <Confetti active={showConfetti} />
        {currentPopup?.type === 'badge' && <BadgePopup badge={{ ...currentPopup.data, description: `${currentPopup.who}: ${currentPopup.data.description}` }} onClose={closePopup} />}
        {currentPopup?.type === 'level' && <LevelUpPopup level={{ ...currentPopup.data, name: `${currentPopup.who} → ${currentPopup.data.name}` }} onClose={closePopup} />}
        {pointsPopup && <PointsPopup points={pointsPopup.points} participantName={pointsPopup.participantName} onClose={() => setPointsPopup(null)} />}
        {showWheel && <SpinningWheel activities={getEligibleActivities()} onComplete={(activity) => { setShowWheel(false); setSearchQuery(activity.name); setActivityFilter('all'); setFocusFilter(''); setView('activities'); }} onClose={() => setShowWheel(false)} />}
        {courseSetup && <CourseSetup course={courseSetup} participants={participants} equipment={equipment} onToggleEquipment={toggleEquipment} onClose={() => setCourseSetup(null)} onStart={(steps, playerIds) => { setCourseRun({ course: courseSetup, steps, playerIds }); setCourseSetup(null); }} />}
        {courseRun && <CourseRunner course={courseRun.course} steps={courseRun.steps} players={runPlayers} onStepDone={(activity, ids) => completeActivity(activity, ids, { quiet: true })} onFinish={finishCourse} onExit={() => setCourseRun(null)} />}
        <div style={{ maxWidth: '800px', margin: '0 auto', padding: '20px', position: 'relative', zIndex: 3 }}>
          {view !== 'dashboard' && (<button onClick={() => { setView('dashboard'); setSelectedParticipant(null); setSearchQuery(''); }} style={{ marginBottom: '16px', padding: '10px 20px', borderRadius: '25px', border: '2px solid #00ffff', background: 'transparent', color: '#00ffff', fontWeight: 'bold', cursor: 'pointer', fontFamily: 'Orbitron, sans-serif', boxShadow: '0 0 15px rgba(0,255,255,0.2)' }}>← BACK</button>)}
          {view === 'dashboard' && renderDashboard()}
          {view === 'activities' && renderActivities()}
          {view === 'courses' && <CoursesView equipment={equipment} participants={participants} onPick={setCourseSetup} />}
          {view === 'favorites' && renderFavorites()}
          {view === 'settings' && <Settings participants={participants} equipment={equipment} activityNotes={activityNotes} onSaveParticipant={saveParticipant} onDeleteParticipant={deleteParticipant} onToggleEquipment={toggleEquipment} />}
          {view === 'participant' && renderParticipantDetail()}
          <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'linear-gradient(to top, rgba(10,10,26,0.98) 0%, rgba(10,10,26,0.95) 100%)', borderTop: '2px solid #00ffff', display: 'flex', justifyContent: 'space-around', padding: '10px 0', boxShadow: '0 -5px 30px rgba(0,255,255,0.2)', zIndex: 100 }}>{[{ id: 'dashboard', icon: '🏠', label: 'HOME' }, { id: 'courses', icon: '🧭', label: 'COURSES' }, { id: 'activities', icon: '🎯', label: 'MISSIONS' }, { id: 'favorites', icon: '💖', label: 'FAVS' }, { id: 'settings', icon: '⚙️', label: 'COMMAND' }].map(nav => (<button key={nav.id} onClick={() => { setView(nav.id); setSelectedParticipant(null); }} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', padding: '8px 10px', border: 'none', background: 'none', cursor: 'pointer', color: view === nav.id ? '#00ffff' : '#666' }}><span style={{ fontSize: '22px', filter: view === nav.id ? 'drop-shadow(0 0 10px #00ffff)' : 'none' }}>{nav.icon}</span><span style={{ fontSize: '10px', fontWeight: view === nav.id ? 'bold' : 'normal', fontFamily: 'Orbitron, sans-serif', letterSpacing: '1px' }}>{nav.label}</span></button>))}</div>
          <div style={{ height: '90px' }} />
        </div>
      </div>);
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
